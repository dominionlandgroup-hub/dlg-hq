<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mailing Status · Dominion Land Group</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f5f4ef;--card:#fff;--ink:#1b2a22;--muted:#6b7a71;--line:#e4e2da;--brand:#1f4d36;--accent:#c8a24a;--ok:#1a9e5a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:28px 16px}
.brand{font-weight:700;color:var(--brand);letter-spacing:.02em;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}
h1{font-size:20px;margin:0 0 6px}.muted{color:var(--muted);font-size:14px}
.steps{display:grid;gap:10px;margin-top:16px}
.step{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.step .dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:#fff;flex:0 0 26px}
.step.done .dot{background:var(--ok);border-color:var(--ok)}
.step .t{flex:1}.step .t b{display:block}.step .t span{font-size:13px;color:var(--muted)}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 16px;background:var(--brand);color:#fff;cursor:pointer}
button:disabled{background:#cfd6d1;cursor:default}
.err{color:#b23b3b}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">DOMINION LAND GROUP</div>
  <div id="app" class="card"><div class="muted">Loading…</div></div>
  <p class="muted" style="text-align:center">Tap each step as the job moves along. Damien sees it right away.</p>
</div>
<script>
const sb=supabase.createClient('https://gdejlpdltnstbwtdpggm.supabase.co','sb_publishable_E9jIHC9hz6oleR4Qd-68bA_ZWEVcAQ_');
// One link can cover several campaigns (one mailing split across campaigns): ?t=code1,code2,...
const T=String(new URLSearchParams(location.search).get('t')||'').split(',').map(s=>s.trim()).filter(Boolean);
const t=T[0];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const when=v=>v?new Date(v).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'';
const ORDER=['received','processing','sent'];
function draw(c){
  const at=ORDER.indexOf(c.status);
  const steps=[['received','Received','We have the list and the letter'],['processing','Processing','Printing and preparing the mail'],['sent','Sent','Mail is out to the post office']];
  document.getElementById('app').innerHTML=`<h1>${esc(c.name)}</h1><div class="muted">${(c.records||0).toLocaleString()} records</div>
   <div class="steps">${steps.map(([k,l,d],i)=>{const done=i<=at;return `<div class="step ${done?'done':''}"><div class="dot">${done?'✓':''}</div><div class="t"><b>${l}</b><span>${done?when(c[k]):d}</span></div>
     ${done?'':`<button ${i!==at+1?'disabled':''} onclick="mark('${k}',this)">Mark ${l.toLowerCase()}</button>`}</div>`}).join('')}</div>`;
}
// Several campaigns show as one job: total records, and a step counts as done only when every campaign has it
// (the date shown is the latest one). Each tap updates every campaign on the link.
function combine(list){if(list.length===1)return list[0];
  const idx=c=>ORDER.indexOf(c.status);const lo=list.reduce((a,c)=>idx(c)<idx(a)?c:a,list[0]);
  const out={name:list.map(c=>c.name).join(' + '),records:list.reduce((a,c)=>a+(c.records||0),0),status:lo.status};
  ORDER.forEach(k=>{const v=list.map(c=>c[k]).filter(Boolean);out[k]=v.length===list.length?v.sort().pop():null});
  if(list.length>1)out.name=`${list.length} lists in this mailing`;out._names=list.map(c=>`${esc(c.name)} (${(c.records||0).toLocaleString()})`);return out}
const drawAll=list=>{const c=combine(list);draw(c);if(c._names)document.querySelector('#app .muted').insertAdjacentHTML('afterend',`<div class="muted" style="margin-top:6px">${c._names.join('<br>')}</div>`)};
async function load(){if(!T.length){document.getElementById('app').innerHTML='<div class="err">This link is missing its code. Please use the link from the email.</div>';return}
  const res=await Promise.all(T.map(x=>sb.rpc('mailhouse_campaign',{t:x})));
  const list=res.map(r=>r.data).filter(Boolean);
  if(!list.length||res.some(r=>r.error||!r.data)){document.getElementById('app').innerHTML='<div class="err">This link was not found. Please use the link from the email.</div>';return}drawAll(list)}
async function mark(s,btn){btn.disabled=true;btn.textContent='Saving…';
  const res=await Promise.all(T.map(x=>sb.rpc('mailhouse_update',{t:x,s})));const bad=res.find(r=>r.error);
  if(bad){btn.disabled=false;btn.textContent='Try again';alert('Could not save: '+bad.error.message);return}drawAll(res.map(r=>r.data))}
load();
</script>
</body>
</html>
