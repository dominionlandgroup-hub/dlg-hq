<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Welcome | We Are Land Specialists</title><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../common.css">
<style>body{background:var(--sand)}.box{max-width:460px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:30px}
.box h1{font-size:42px;margin-bottom:8px}label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
input{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px}.box .btn{width:100%;text-align:center;margin-top:18px;cursor:pointer}.err{color:#b23b3b;font-size:14px;margin-top:10px}</style></head><body>
<main class="box" id="box"><h1>Thank you!</h1><p>Confirming your payment…</p></main>
<script>
const API='https://gdejlpdltnstbwtdpggm.supabase.co/functions/v1/wals/';const sid=new URLSearchParams(location.search).get('session_id')||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function claim(b){const r=await fetch(API+'claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid,...b})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Something went wrong');return j}
const box=document.getElementById('box');
const book=b=>b?`<p style="margin-top:22px"><b>Next: book your first coaching call.</b> Pick a Tuesday or Thursday time that works for you.</p><a class="btn gold" href="${esc(b)}" target="_blank" rel="noopener">Book my first call</a>`:'';
function done(j){try{localStorage.setItem('wals_t',j.token)}catch(e){}
  box.innerHTML=`<h1>You're in!</h1><p>Your course login is ready${j.name?', '+esc(j.name.split(' ')[0]):''}.</p><a class="btn" href="../learn/">Start the course</a>${book(j.booking)}`}
(async()=>{if(!sid){box.innerHTML='<h1>Welcome</h1><p>Already a student? <a href="../learn/">Log in here</a>.</p>';return}
  try{const j=await claim({});
    if(j.existing){box.innerHTML=`<h1>You're in!</h1><p>You already have a login for ${esc(j.email)}.</p><a class="btn" href="../learn/">Log in to the course</a>${book(j.booking)}`;return}
    box.innerHTML=`<h1>Thank you!</h1><p>Payment confirmed. Create your course login for <b>${esc(j.email)}</b>.</p>
     <form id="f"><label for="nm">Your name</label><input id="nm" value="${esc(j.name||'')}" autocomplete="name">
     <label for="pw">Choose a password (8+ characters)</label><input id="pw" type="password" autocomplete="new-password" required>
     <button class="btn" type="submit">Create my login</button><div class="err" id="err" role="alert"></div></form>`;
    document.getElementById('f').onsubmit=async e=>{e.preventDefault();document.getElementById('err').textContent='';
      try{done(await claim({name:document.getElementById('nm').value.trim(),password:document.getElementById('pw').value}))}catch(x){document.getElementById('err').textContent=x.message}}}
  catch(e){box.innerHTML=`<h1>Thank you!</h1><p>${esc(e.message)}</p>`}})();
</script></body></html>
