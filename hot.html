<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5C2977">
<meta name="robots" content="noindex">
<title>Hot seller on hold</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{color-scheme:light;--bg:#f7f6fa;--card:#fff;--ink:#231b30;--muted:#6e6880;--line:#e7e3ee;--brand:#5C2977;--red:#b23b3b;--green:#2f6b3a;--gold:#D5A940}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 4px;color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 12px}.facts b{color:var(--muted);font-weight:600}
button{font:inherit;cursor:pointer}
.go{display:block;width:100%;border:0;border-radius:14px;padding:20px;font-size:22px;font-weight:800;background:var(--green);color:#fff;margin-top:12px}
.go[disabled]{opacity:.6}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.notes{white-space:pre-wrap;font-size:13.5px;max-height:50vh;overflow:auto;background:#fbfafd;border-radius:10px;padding:10px}
.muted{color:var(--muted)}.err{color:var(--red);font-weight:600;margin-top:10px}
a{color:var(--brand)}
</style>
</head>
<body>
<main>
 <h1 id="ttl">Hot seller on hold</h1>
 <div class="muted" id="sub">Loading…</div>
 <div id="body"></div>
</main>
<script>
const SB_URL='https://gdejlpdltnstbwtdpggm.supabase.co',SB_KEY='sb_publishable_E9jIHC9hz6oleR4Qd-68bA_ZWEVcAQ_';
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TOKEN=new URLSearchParams(location.search).get('h')||'';
let T0=0,READY=false;
async function load(){
  const {data,error}=await sb.rpc('hot_hold_open',{p_token:TOKEN});
  if(error){$('sub').textContent=error.message;return}
  const h=data;READY=h.ready;T0=Date.now()-h.seconds*1000;
  $('sub').textContent=`From ${h.caller||'your caller'}`;
  $('body').innerHTML=`<button class="go" id="go" type="button" ${h.ready?'disabled':''}>${h.ready?'Done - she is transferring now':"I'm ready - transfer now"}</button>
   <div class="muted" id="clock" style="text-align:center;margin-top:6px"></div><div class="err" id="err" role="alert"></div>
   <div class="card"><div class="facts"><b>On hold</b><span>${esc(h.seller)}</span><b>Number</b><span>${esc(h.phone||'—')}</span>
    <b>Price in mind</b><span>${esc(h.price||'not given')}</span><b>Heirs</b><span>${esc(h.heirs||'not asked yet')}</span>
    <b>Lead</b><span>${esc(h.label)}</span></div>
    <p style="margin:12px 0 0"><a href="https://landiq.land/#deal-${encodeURIComponent(h.deal_id)}">Open the lead in DLG HQ</a></p></div>
   <div class="card"><b>Notes</b><div class="notes">${esc(h.notes)}</div></div>`;
  $('go').onclick=ready;tick();setInterval(tick,1000)}
function tick(){const s=Math.round((Date.now()-T0)/1000),c=$('clock');if(!c)return;
  c.textContent=READY?'Answer your phone - she is transferring the seller.':s>=90?`On hold ${s}s - she may have booked an appointment instead. Tap anyway if you can take it.`:`On hold ${s}s`}
async function ready(){const b=$('go');b.disabled=true;$('err').textContent='';
  const {error}=await sb.rpc('hot_hold_ready',{p_token:TOKEN});
  if(error){$('err').textContent=error.message;b.disabled=false;return}
  READY=true;b.textContent='Done - she is transferring now';tick()}
load();
</script>
</body>
</html>
