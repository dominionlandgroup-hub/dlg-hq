<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DLG HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{color-scheme:light;--bg:#f7f6fa;--card:#fff;--ink:#231b30;--muted:#6e6880;--line:#e7e3ee;--brand:#5C2977;--brand2:#7a3f9c;--accent:#D5A940;--gold:#D5A940;--gold-d:#a7822a;--red:#b23b3b;--chip:#f2ecf7;--side:#ffffff;--hot:#d9480f}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
a{color:var(--brand2)}button{font:inherit;cursor:pointer}
.hidden{display:none!important}
.center{max-width:400px;margin:12vh auto;padding:0 16px}
#app{display:flex;height:100vh}
aside{width:230px;background:var(--side);color:var(--ink);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
aside .logo{padding:16px 18px 12px;font-family:Montserrat,Inter,sans-serif;font-weight:700;font-size:17px;color:var(--brand);letter-spacing:.2px;display:flex;align-items:center;gap:10px}aside .logo .ico{width:40px;height:40px;flex:0 0 40px}
aside .logo small{display:block;font-weight:600;font-size:10px;color:var(--gold-d);letter-spacing:.6px;text-transform:uppercase;margin-top:2px}
aside .grp{padding:14px 18px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
aside a.nav{display:flex;align-items:center;gap:8px;padding:8px 18px;color:var(--ink);text-decoration:none;border-left:3px solid transparent;cursor:pointer}
aside a.nav:hover{background:var(--chip)}
aside a.nav.on{background:var(--chip);border-left-color:var(--gold);color:var(--brand);font-weight:700}
aside a.nav .badge{margin-left:auto;background:var(--gold);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}
aside .foot{margin-top:auto;padding:14px 18px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.verse{font-family:Montserrat,Inter,sans-serif;font-weight:600;color:var(--brand);font-size:12.5px;line-height:1.35}.verse small{display:block;color:var(--gold-d);font-weight:600;margin-top:3px;font-size:10.5px;letter-spacing:.4px}
.vbanner{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#fff,#fbf7ec);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:10px 14px;margin-bottom:14px}.vbanner .ico{width:30px;height:30px;flex:0 0 30px}.vbanner .verse{font-size:14px}
h1,h2,h3,.sec{font-family:Montserrat,Inter,sans-serif}
aside .foot button{background:none;border:1px solid var(--line);color:var(--brand);border-radius:7px;padding:5px 10px;margin-top:6px}
main{flex:1;overflow:auto;padding:22px 26px}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.topbar h1{font-size:21px;margin:0;flex:1;min-width:160px}
#actions{display:flex;gap:8px;flex-wrap:wrap}
#mtoggle{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.btn{background:var(--brand);color:#fff;border:0;border-radius:9px;padding:9px 14px;font-weight:600;white-space:nowrap}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{background:#fff;color:var(--red);border:1px solid #e9c9c9}
input,select,textarea{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:80px}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.filters>*{width:auto;flex:1;min-width:130px}
.muted{color:var(--muted)}.small{font-size:12px}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--brand);font-weight:600}
.pill.hot{background:#fde8dc;color:var(--hot)}.pill.warm{background:#fff4d6;color:#7a5a00}.pill.cold{background:#e7eef7;color:#2d5a8a}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px}tr.click{cursor:pointer}tr.click:hover{background:#fafaf6}
.right{text-align:right}.num{font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .v{font-size:22px;font-weight:700;color:var(--brand)}.kpi .l{color:var(--muted);font-size:12px}
.kpi.gold{border-top:3px solid var(--accent)}
.gsearch{margin:-8px 0 14px}.gwrap{position:relative;max-width:520px}.gwrap input{padding-right:40px}.gbtn{position:absolute;right:4px;top:4px;border:0;background:none;font-size:18px;color:var(--muted)}
.gres{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.14);z-index:50;max-height:70vh;overflow:auto}
.gres .gh{display:flex;justify-content:space-between;background:#f1f0eb;padding:7px 12px;font-size:12px;font-weight:700}.gres a{display:block;padding:9px 12px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}.gres a:hover{background:var(--chip)}
.gres a b{color:#5C2977}.gres .sm{font-size:12px;color:var(--muted)}mark{background:#fff1a8;padding:0}
.rhead{display:flex;gap:24px;align-items:center;flex-wrap:wrap}.rhead .nm{flex:1;min-width:200px}.rhead .nm small{color:var(--muted);display:block}.rhead .nm b{color:#5C2977;font-size:19px}
.rgrid{display:grid;grid-template-columns:minmax(260px,1fr) 2fr;gap:14px}.rgrid .card{margin:0 0 14px}
.codechip{display:inline-block;border:1px solid var(--line);border-left:4px solid #D5A940;border-radius:6px;padding:3px 12px;color:#2d5a8a}
@media(max-width:900px){.rgrid{grid-template-columns:1fr}}
.ctable th{white-space:nowrap}.sortable{cursor:pointer;user-select:none}.sortable .arr{color:var(--muted);font-size:11px}
a.cname{color:#5C2977;font-weight:600;text-decoration:none}.pager{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:8px 0}
.mprog{display:flex;align-items:center;gap:8px;min-width:170px}.mprog .trk{flex:1;height:7px;background:var(--chip);border-radius:6px;overflow:hidden}.mprog .trk span{display:block;height:100%;background:var(--gold)}.mprog .ok{color:#1a9e5a;font-weight:600}
.menu{position:relative;display:inline-block}.mlist{display:none;position:absolute;right:0;top:100%;z-index:30;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);min-width:190px;padding:6px}
.mlist a{display:block;padding:8px 10px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:14px}.mlist a:hover{background:var(--chip)}
.card.rec{display:flex;gap:12px;align-items:flex-start}.card.rec .rl{flex:1;min-width:0}.card.rec .rr{flex:1.6;margin:0;padding:10px 12px}.card.rec address{font-style:normal;margin:4px 0 8px;color:var(--muted)}
.code{display:inline-block;background:#e8f1fb;color:#2d5a8a;border-radius:6px;padding:3px 10px;font-size:13px}
@media(max-width:900px){.card.rec{flex-direction:column}}
.pgrid{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}.pgrid>.card{margin:0}
.pstats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;text-align:center;align-items:end}
.pst .l{color:var(--ink);font-size:12px;line-height:1.25}.pst .l.big{color:#5C2977;font-weight:700;font-size:17px}.pst .v{font-weight:700;font-size:17px;margin-top:8px}
table.roi th{font-size:11.5px;color:var(--muted);font-weight:600;vertical-align:bottom}table.roi tr.grp th{background:#f1f0eb;color:var(--ink);font-size:13px;text-align:left}
table.roi .bl{border-left:1px solid var(--line)}table.roi tr.tot td{background:#f5f4ef}
@media(max-width:900px){.pgrid{grid-template-columns:1fr}.pstats{grid-template-columns:repeat(3,1fr)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid2>.card{margin:0}
h3.sec{margin:0 0 10px;font-size:14px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px}.kv>div:nth-child(odd){color:var(--muted)}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0}.bar .lbl{width:150px;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .trk{flex:1;height:9px;background:var(--chip);border-radius:6px;overflow:hidden}.bar .fill{height:100%;background:var(--brand2)}
.bar .n{width:46px;text-align:right;font-weight:600}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{background:#ecebe4;border-radius:12px;width:280px;flex-shrink:0;display:flex;flex-direction:column;max-height:calc(100vh - 150px)}
.col .hd{padding:10px 12px 2px;font-weight:600}
.col .meta{color:var(--muted);font-size:12px;padding:0 12px 8px}
.col .cards{padding:0 8px 8px;overflow-y:auto;flex:1;min-height:40px}
.col.over{outline:2px dashed var(--brand2);outline-offset:-4px}
.dcard{background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand2);border-radius:9px;padding:9px 10px;margin-bottom:8px;cursor:grab}
.dcard.dragging{opacity:.4}
.dcard .t{font-weight:600;display:flex;gap:6px;align-items:flex-start}.dcard .t span:first-child{flex:1}
.dcard .s{color:var(--muted);font-size:12px;margin-top:3px}
.dcard .val{background:var(--chip);color:var(--brand);font-weight:700;font-size:12px;border-radius:6px;padding:1px 6px;white-space:nowrap}
.addcard{display:block;width:calc(100% - 16px);margin:0 8px 10px;background:none;border:1px dashed #c9c7bc;border-radius:9px;padding:7px;color:var(--muted)}
.drawer{position:fixed;inset:0;background:#0007;display:none;z-index:2000}
.drawer .panel{position:absolute;right:0;top:0;bottom:0;width:min(640px,100%);background:var(--bg);overflow:auto;padding:18px}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.inbox3{display:grid;grid-template-columns:300px 1fr 300px;gap:12px;height:calc(100vh - 150px)}.tlist{background:#fff;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}
.tl-top{padding:10px;border-bottom:1px solid var(--line)}.seg{display:flex;margin-top:8px;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg button{flex:1;border:0;background:#fff;padding:5px 0;font-size:12.5px}.seg button.on{background:var(--brand);color:#fff}
#tl{overflow:auto;flex:1}.tsec{padding:8px 12px 4px;font-size:12px;font-weight:700;color:var(--gold-d)}.titem{display:flex;gap:9px;padding:10px 12px;cursor:pointer;border-bottom:1px solid #f2f0f5;position:relative}.titem:hover{background:#faf8fc}.titem.on{background:var(--chip);box-shadow:inset 3px 0 0 var(--brand)}
.titem .av{width:34px;height:34px;flex:0 0 34px;border-radius:50%;border:1.5px solid var(--brand);color:var(--brand);display:grid;place-items:center;font-size:12px;font-weight:700}.titem .tb{flex:1;min-width:0}.titem .tr1{display:flex;justify-content:space-between;gap:6px}.titem .tr1 b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titem .tr2{display:flex;gap:6px;font-size:12px;color:var(--muted)}.titem .tr2 span:first-child{flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.titem .d{white-space:nowrap}.titem.unread b{color:var(--brand)}.titem .ub{position:absolute;right:10px;bottom:8px;background:var(--gold);color:#fff;border-radius:999px;font-size:11px;padding:0 6px}
.chead{display:flex;align-items:center;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line)}.msgs2{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#fcfbfd}
.bub{max-width:78%}.bub.out{align-self:flex-end;text-align:right}.bub .meta{font-size:11.5px;color:var(--muted);margin-bottom:3px}.bub .bb{display:inline-block;text-align:left;padding:10px 12px;border-radius:12px;background:#fff;border:1px solid var(--line)}.bub.out .bb{background:#fbf3dd;border-color:#f1e2b5}
.cpanel{overflow:auto}
@media(max-width:1100px){.inbox3{grid-template-columns:260px 1fr}.cpanel{display:none}}@media(max-width:700px){.inbox3{grid-template-columns:1fr;height:auto}.tlist{max-height:45vh}}
.inbox{display:grid;grid-template-columns:320px 1fr;gap:14px;height:calc(100vh - 110px)}
.threads{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
.thread{padding:11px 13px;border-bottom:1px solid var(--line);cursor:pointer}.thread:hover{background:#fafaf6}
.thread.on{background:var(--chip)}.thread.unread .nm{font-weight:700}
.convo{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:75%;padding:8px 11px;border-radius:12px;white-space:pre-wrap}
.msg.in{background:#f0efe9;align-self:flex-start}.msg.out{background:var(--brand);color:#fff;align-self:flex-end}
.msg .when{font-size:11px;opacity:.7;margin-top:3px}
.composer{border-top:1px solid var(--line);padding:10px;display:flex;gap:8px}
#map{height:calc(100vh - 210px);min-height:380px;border-radius:12px;border:1px solid var(--line)}
.split{display:grid;grid-template-columns:360px 1fr;gap:14px}
.plist{max-height:calc(100vh - 210px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
.pitem{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}.pitem:hover{background:#fafaf6}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:9px;z-index:3000;font-size:13px;max-width:90vw}
@media(max-width:900px){
 aside{position:fixed;inset:0 auto 0 0;z-index:1500;transform:translateX(-100%);transition:transform .2s}
 aside.open{transform:none}#mtoggle{display:inline-block}
 main{padding:16px}.kpis{grid-template-columns:repeat(2,1fr)}.grid2,.split,.inbox{grid-template-columns:1fr}
 .inbox{height:auto}.threads{max-height:40vh}#map{height:55vh}.kv{grid-template-columns:110px 1fr}
}
</style>
</head>
<body>

// ---------- dashboard (modeled on Pebble) ----------
function dashRange(){const k=store.get('dashRange')||'30d';const t=new Date();t.setHours(12,0,0,0);const iso=d=>d.toISOString().slice(0,10);let a=new Date(t),b=new Date(t);
  if(k==='week'){a.setDate(t.getDate()-t.getDay())}else if(k==='month'){a=new Date(t.getFullYear(),t.getMonth(),1,12)}else if(k==='quarter'){a=new Date(t.getFullYear(),Math.floor(t.getMonth()/3)*3,1,12)}

  return [iso(a),iso(b),k]}
const dnum=s=>{if(s==null)return 0;s=String(s).replace(/,/g,'');return /k$/i.test(s)?parseFloat(s)*1000:parseFloat(s)||0};
const talkSec=s=>{if(!s)return 0;const p=String(s).split(':').map(Number);return p.length===2?p[0]*60+p[1]:+p[0]||0};
const fmtTalk=sec=>`${Math.floor(sec/60)}:${String(Math.round(sec%60)).padStart(2,'0')}`;
const kfmt=n=>n>=1000?(n/1000).toFixed(1).replace(/\.0$/,'')+'k':String(Math.round(n));
// Pebble history comes in month rows (older) and day rows (recent); a partly covered month counts pro rata.
function histSum(H,a,b){const A=new Date(a+'T12:00:00'),B=new Date(b+'T12:00:00'),o={deals:0,seller:0,buyer:0,offers:0,conv:0,calls:0,missed:0,talk:0,texts:0,emails:0};
  for(const h of H){const s=new Date(h.start_date+'T12:00:00'),e=new Date(h.end_date+'T12:00:00');const lo=Math.max(s,A),hi=Math.min(e,B);if(hi<lo)continue;
    const f=(hi-lo)/864e5+1>=(e-s)/864e5+1?1:((hi-lo)/864e5+1)/((e-s)/864e5+1);
    o.deals+=h.deals*f;o.seller+=h.deals_seller*f;o.buyer+=h.deals_buyer*f;o.offers+=h.offers*f;o.conv+=h.conversations*f;o.calls+=h.calls*f;o.missed+=h.missed*f;o.talk+=h.talk_sec*f;o.texts+=h.texts*f;o.emails+=h.emails*f}
  return o}
function buckets(a,b,n=6){const A=new Date(a+'T12:00:00'),B=new Date(b+'T12:00:00');const step=Math.max(1,Math.ceil(((B-A)/864e5+1)/n));const out=[];
  for(let d=new Date(A);d<=B;d.setDate(d.getDate()+step)){const e=new Date(d);e.setDate(e.getDate()+step-1);out.push([d.toISOString().slice(0,10),(e>B?B:e).toISOString().slice(0,10)])}return out}
const lbl=s=>{const d=new Date(s+'T12:00:00');return `${d.getMonth()+1}/${d.getDate()}/${String(d.getFullYear()).slice(2)}`};
let CHARTS=[];
async function vDashboard(){
  const [a,b,k]=dashRange();
  const opts=[['week','This week'],['month','This month'],['quarter','This quarter'],['year','This year'],['30d','Past 30 days'],['all','All time'],['custom','Custom']];
  $('actions').innerHTML=`<div class="row" style="flex-wrap:nowrap;gap:6px;align-items:center"><span class="small muted">Date</span><select id="dr" style="width:auto">${opts.map(([v,t])=>`<option value="${v}" ${v===k?'selected':''}>${t}</option>`).join('')}</select>
    <span id="drc" style="display:${k==='custom'?'flex':'none'};gap:6px"><input type="date" id="dra" value="${a}" style="width:auto"><input type="date" id="drb" value="${b}" style="width:auto"></span><span class="small muted">${fmtDate(a)} – ${fmtDate(b)}</span></div>`;
  $('dr').onchange=e=>{store.set('dashRange',e.target.value);vDashboard()};
  if($('dra')){const f=()=>{store.set('dashA',$('dra').value);store.set('dashB',$('drb').value);vDashboard()};$('dra').onchange=f;$('drb').onchange=f}
  const end=b+'T23:59:59';
  const [{data:H},{data:tx},{data:camps},{data:dl},{data:msgs}]=await Promise.all([
    sb.from('pebble_history').select('*'),
    sb.from('transactions').select('id,property_id,kind,tx_date,price,costs,notes,properties(id,apn,address,city)').order('tx_date',{ascending:false}).limit(5000),
    sb.from('campaigns').select('id,name,drop_date,records,cost').limit(2000),
    sb.from('deals').select('id,board,created_at,source,campaign_id').neq('source','pebble').gte('created_at',a).lte('created_at',end).limit(5000),
    sb.from('messages').select('lead_id,channel,direction,duration_s,created_at').gte('created_at',a).lte('created_at',end).limit(10000)]);
  const inR=d=>d&&d>=a&&d<=b;
  const h=histSum(H||[],a,b);
  // Live numbers made in DLG HQ after the move
  const liveDeals=(dl||[]).length,liveSeller=(dl||[]).filter(d=>d.board==='seller').length;
  const M=msgs||[];const live={conv:new Set(M.map(m=>m.lead_id)).size,calls:M.filter(m=>m.channel==='call'&&m.direction==='out').length,missed:M.filter(m=>m.channel==='call'&&m.direction==='in'&&!m.duration_s).length,
    talk:M.filter(m=>m.channel==='call').reduce((s,m)=>s+(m.duration_s||0),0),texts:M.filter(m=>m.channel==='sms'&&m.direction==='out').length,emails:M.filter(m=>m.channel==='email'&&m.direction==='out').length};
  const T=tx||[];const offersLive=T.filter(t=>t.kind==='offer'&&inR(t.tx_date)).length;
  // ROI rows: a purchase and its sale on the same property; shown when the sale (or purchase if unsold) falls in range
  const byP={};T.filter(t=>t.kind!=='offer').forEach(t=>{const key=t.property_id||('n'+t.id);const p=byP[key]||(byP[key]={p:t.properties,notes:t.notes,buy:null,sell:null});if(t.kind==='purchase'&&!p.buy)p.buy=t;if(t.kind==='sale'&&!p.sell)p.sell=t});
  const rows=Object.values(byP).filter(r=>inR(r.sell?.tx_date||r.buy?.tx_date)).sort((x,y)=>(y.sell?.tx_date||y.buy?.tx_date).localeCompare(x.sell?.tx_date||x.buy?.tx_date));
  const purchased=T.filter(t=>t.kind==='purchase'&&inR(t.tx_date)).length,sold=T.filter(t=>t.kind==='sale'&&inR(t.tx_date)).length;
  let spent=0,rev=0,durs=[];rows.forEach(r=>{if(r.buy&&r.sell){spent+=(+r.buy.price||0)+(+r.buy.costs||0)+(+r.sell.costs||0);rev+=+r.sell.price||0;durs.push(Math.round((new Date(r.sell.tx_date)-new Date(r.buy.tx_date))/864e5))}});
  const profit=rev-spent,roi=spent?profit/spent*100:0,avgDur=durs.length?Math.round(durs.reduce((s,x)=>s+x,0)/durs.length):0;
  const C=(camps||[]).filter(c=>inR(c.drop_date));const cSpent=C.reduce((s,c)=>s+(+c.cost||0),0),cRec=C.reduce((s,c)=>s+(c.records||0),0);
  const deals=Math.round(h.deals)+liveDeals;
  // ROAS: profit from sold properties that were mailed in a campaign created in this range, over that range's mail spend
  const cIds=new Set(C.map(c=>c.id));let attrProfit=0;
  if(cIds.size){const pids=rows.filter(r=>r.buy&&r.sell&&r.p?.id).map(r=>r.p.id);if(pids.length){const {data:crs}=await sb.from('campaign_records').select('property_id,campaign_id').in('property_id',pids);
    const hit=new Set((crs||[]).filter(x=>cIds.has(x.campaign_id)).map(x=>x.property_id));rows.forEach(r=>{if(r.buy&&r.sell&&hit.has(r.p?.id))attrProfit+=(+r.sell.price)-(+r.buy.price)-(+r.buy.costs||0)-(+r.sell.costs||0)})}}
  const roas=cSpent?attrProfit/cSpent*100:0;
  const S={conv:Math.round(h.conv)+live.conv,calls:Math.round(h.calls)+live.calls,missed:Math.round(h.missed)+live.missed,talk:h.talk+live.talk,texts:Math.round(h.texts)+live.texts,emails:Math.round(h.emails)+live.emails};

// ---------- boards ----------
async function vBoard(board){
  $('actions').innerHTML=`<input id="bf" placeholder="Filter name / address / APN" style="width:210px"><select id="bp" style="width:auto"><option value="">Any priority</option><option>hot</option><option>warm</option><option>cold</option></select><button class="btn" onclick="newDeal('${board}')">+ Add Deal</button><button class="btn ghost" onclick="addStage('${board}')">+ Stage</button>`;
  let data=[],error=null;for(let f=0;;f+=1000){const r=await sb.from('deals').select('*, leads(id,full_name,first_name,last_name,phone), properties(apn,address,city,county,county_state,acres)').eq('board',board).order('position').range(f,f+999);if(r.error){error=r.error;break}data.push(...r.data);if(r.data.length<1000)break}
  if(error){$('view').innerHTML=`<div class="card">${esc(error.message)}</div>`;return}
  window._deals=data||[];
  const draw=()=>{
    const f=($('bf').value||'').toLowerCase(),pr=$('bp').value;
    const list=_deals.filter(d=>(!pr||d.priority===pr)&&(!f||[d.property_label,leadName(d.leads),d.properties?.address,d.properties?.apn].join(' ').toLowerCase().includes(f)));
    const st=STAGES.filter(s=>s.board===board);
    $('view').innerHTML=`<div class="board">${st.map(s=>{const ds=list.filter(d=>d.stage_id===s.id),tot=ds.reduce((a,d)=>a+(+d.value||0),0);
      return `<div class="col" data-stage="${s.id}"><div class="hd">${esc(s.name)}</div><div class="meta">${ds.length} deal${ds.length===1?'':'s'}${tot?' / '+money(tot):''}</div>
      <div class="cards">${ds.map(card).join('')}</div><button class="addcard" onclick="newDeal('${board}',${s.id})">+ Add Deal</button></div>`}).join('')}</div>`;
    wireDnD(board);};
  $('bf').oninput=draw;$('bp').onchange=draw;draw();
}
function card(d){const p=d.properties||{},l=d.leads;
  return `<div class="dcard" draggable="true" data-id="${d.id}" style="border-left-color:${d.priority==='hot'?'var(--hot)':d.priority==='warm'?'var(--accent)':'var(--brand2)'}" onclick="openDeal(${d.id})">
   <div class="t"><span>${esc(leadName(l)||d.property_label||'Deal')}</span>${d.value?`<span class="val">${money(d.value)}</span>`:''}</div>
   ${p.apn?`<div class="s">APN ${esc(p.apn)}</div>`:''}
   <div class="s">${esc([p.address||d.property_label,p.city].filter(Boolean).join(', '))}</div>
   ${p.county?`<div class="s">${esc(p.county)}, ${esc(p.county_state||'')}${p.acres?' | '+(+p.acres).toFixed(2)+' ac':''}</div>`:''}
   <div class="s" style="display:flex;gap:6px;align-items:center;margin-top:6px">${d.priority?`<span class="pill ${d.priority}">${d.priority}</span>`:''}${d.closing_date?`<span>Close ${d.closing_date}</span>`:''}<span style="margin-left:auto">${ago(d.updated_at||d.created_at)}</span></div></div>`}
function wireDnD(board){let dragId=null;
  document.querySelectorAll('.dcard').forEach(c=>{c.ondragstart=e=>{dragId=+c.dataset.id;c.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',c.dataset.id)};c.ondragend=()=>c.classList.remove('dragging')});
  document.querySelectorAll('.col').forEach(col=>{col.ondragover=e=>{e.preventDefault();col.classList.add('over')};col.ondragleave=()=>col.classList.remove('over');
    col.ondrop=async e=>{e.preventDefault();col.classList.remove('over');if(!dragId)return;const sid=+col.dataset.stage;const d=_deals.find(x=>x.id===dragId);if(!d||d.stage_id===sid)return;
      const s=STAGES.find(x=>x.id===sid);
      const upd={stage_id:sid,updated_at:new Date().toISOString(),status:s.closed?'won':/dead|no go/i.test(s.name)?'lost':'open'};
      const {error}=await sb.from('deals').update(upd).eq('id',dragId);
      if(error)toast(error.message);else{toast('Moved to '+s.name);if(d.lead_id)sb.from('activity').insert({lead_id:d.lead_id,kind:'status',body:'Deal moved to '+s.name})}
      vBoard(board)}});}
async function addStage(board){const n=prompt('New stage name');if(!n)return;const pos=Math.max(0,...STAGES.filter(s=>s.board===board).map(s=>s.position))+1;
  const {data,error}=await sb.from('board_stages').insert({board,name:n,position:pos}).select().single();if(error)return toast(error.message);STAGES.push(data);vBoard(board)}

function drawCamps(){const P=10,q=CSTATE.q.toLowerCase();
  let L=_camps.filter(c=>!q||c.name.toLowerCase().includes(q));
  const k=CSTATE.sort,dir=CSTATE.dir==='asc'?1:-1;L.sort((x,y)=>{const a=x[k]??'',b=y[k]??'';return (typeof a==='number'||typeof b==='number'?(+a||0)-(+b||0):String(a).localeCompare(String(b)))*dir||String(y.drop_date).localeCompare(String(x.drop_date))});
  const pages=Math.max(1,Math.ceil(L.length/P));CSTATE.page=Math.min(CSTATE.page,pages-1);const S=L.slice(CSTATE.page*P,CSTATE.page*P+P);
  const th=(key,label,cls='right')=>`<th class="${cls} sortable" onclick="sortCamps('${key}')">${label} <span class="arr">${CSTATE.sort===key?(CSTATE.dir==='asc'?'↑':'↓'):'↑↓'}</span></th>`;
  const pager=`<div class="pager"><span class="small">${L.length?CSTATE.page*P+1:0} - ${Math.min(L.length,CSTATE.page*P+P)} of ${L.length} results</span><button class="btn ghost sm" ${CSTATE.page?'':'disabled'} onclick="CSTATE.page--;drawCamps()">‹</button><button class="btn ghost sm" ${CSTATE.page<pages-1?'':'disabled'} onclick="CSTATE.page++;drawCamps()">›</button></div>`;
  $('ctab').innerHTML=pager+`<div class="card" style="overflow-x:auto;padding:0"><table class="ctable"><tr>${th('name','Name','')}${th('drop_date','Created','')}<th>Mailing Progress</th>${th('records','Records')}${th('cost','Amount Spent')}${th('deals','Deals')}${th('resp','Response Rate')}${th('offers','Offers')}${th('purchases','Purchases')}${th('sales','Sales')}<th></th></tr>
   ${S.map(x=>`<tr><td><a href="#" class="cname" onclick="go('campaign:${x.id}');return false">${esc(x.name)}</a></td><td>${fmtDate(x.drop_date||x.created_at)}</td><td>${mailProgress(x)}</td>
     <td class="right num">${(x.records||0).toLocaleString()}</td><td class="right num" style="color:#a7822a">${money(x.cost)}</td><td class="right num">${x.deals}</td><td class="right num">${x.resp.toFixed(2)}%</td><td class="right num">${x.offers}</td><td class="right num">${x.purchases}</td><td class="right num">${x.sales}</td>
     <td><div class="menu"><button class="btn ghost sm" onclick="toggleMenu(this)">···</button><div class="mlist"><a href="#" onclick="startMailing(${x.id});return false">Start Mailing</a><a href="#" onclick="copyMailLink(${x.id});return false">Copy mail house link</a><a href="#" onclick="remarket(${x.id});return false">Remarket</a><a href="#" onclick="splitCampaign(${x.id});return false">Split</a><a href="#" onclick="editCampaign(${x.id});return false">Edit</a></div></div></td></tr>`).join('')||'<tr><td colspan="11" class="muted">No campaigns match.</td></tr>'}</table></div>`+pager}
function sortCamps(k){if(CSTATE.sort===k)CSTATE.dir=CSTATE.dir==='asc'?'desc':'asc';else{CSTATE.sort=k;CSTATE.dir=k==='name'?'asc':'desc'}CSTATE.page=0;drawCamps()}
function toggleMenu(btn){const m=btn.nextElementSibling;const open=m.style.display==='block';document.querySelectorAll('.mlist').forEach(x=>x.style.display='none');m.style.display=open?'none':'block'}
document.addEventListener('click',e=>{if(!e.target.closest('.menu'))document.querySelectorAll('.mlist').forEach(x=>x.style.display='none')});
async function copyMailLink(id){const {data:c}=await sb.from('campaigns').select('mail_token').eq('id',id).single();const u=mailLink(c);try{await navigator.clipboard.writeText(u);toast('Mail house link copied')}catch(e){prompt('Mail house link',u)}}

// ---------- one campaign (modeled on Pebble's campaign page) ----------
let RSTATE={id:null,page:0,q:'',tag:'',board:'',sel:new Set()};
async function vCampaign(id){

  const [{data:c},dc]=await Promise.all([sb.from('campaigns').select('*').eq('id',id).single(),campDealCounts()]);

  const s=campStats(c,dc);$('title').textContent=c.name;
  $('actions').innerHTML=`<button class="btn ghost" onclick="go('campaigns')">← Back to Campaigns</button><button class="btn ghost" onclick="remarket(${id})">Remarket</button><button class="btn ghost" onclick="go('import')">Import List</button><button class="btn" onclick="startMailing(${id})">Start Mailing</button>
   <div class="menu"><button class="btn ghost" onclick="toggleMenu(this)">···</button><div class="mlist"><a href="#" onclick="splitCampaign(${id});return false">Split</a><a href="#" onclick="editCampaign(${id});return false">Edit Campaign</a></div></div>`;
  const st=(l,v,col)=>`<div class="pst"><div class="l">${l}</div><div class="v" ${col?`style="color:${col}"`:''}>${v}</div></div>`;

   ${c.channel==='mail'?`<div class="card"><div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><b>Mailing Progress</b><div style="flex:1;min-width:220px">${mailProgress(c)}</div>
     <span class="small muted">${[['To mail house',c.mail_to_house_at],['Received',c.mail_received_at],['Processing',c.mail_processing_at],['Mailed',c.mail_sent_at]].filter(x=>x[1]).map(x=>x[0]+' '+new Date(x[1]).toLocaleDateString()).join(' · ')}</span>
     <button class="btn ghost sm" onclick="copyMailLink(${id})">Copy mail house link</button></div></div>`:''}
   <div class="card" style="padding:12px 14px"><div class="row" style="align-items:center;gap:8px;flex-wrap:wrap">
     <input id="rq" placeholder="Search owner, code, APN or address" value="${esc(RSTATE.q)}" style="max-width:300px">
     <select id="rtag" style="width:auto"><option value="">Tag: Any</option>${['Due Diligence','Not Selling','Overpriced Offer'].map(t=>`<option ${RSTATE.tag===t?'selected':''}>${t}</option>`).join('')}</select>
     <select id="rboard" style="width:auto"><option value="">Board: Any</option><option value="seller" ${RSTATE.board==='seller'?'selected':''}>Seller Deals</option><option value="buyer" ${RSTATE.board==='buyer'?'selected':''}>Buyer Deals</option></select>
     <span style="flex:1"></span><div class="menu"><button class="btn ghost" onclick="toggleMenu(this)">Actions ▾</button><div class="mlist"><a href="#" onclick="adjustPrice(${id});return false">Adjust Price</a><a href="#" onclick="exportCampaign(${id});return false">Export</a></div></div></div></div>
   <div id="rlist"><div class="muted">Loading…</div></div>`;
  let t;$('rq').oninput=e=>{clearTimeout(t);t=setTimeout(()=>{RSTATE.q=e.target.value.trim();RSTATE.page=0;loadRecs(id)},300)};
  $('rtag').onchange=e=>{RSTATE.tag=e.target.value;RSTATE.page=0;loadRecs(id)};$('rboard').onchange=e=>{RSTATE.board=e.target.value;RSTATE.page=0;loadRecs(id)};
  loadRecs(id)}
async function loadRecs(id){const P=20;
  const {data,error}=await sb.rpc('campaign_records_page',{cid:id,q:RSTATE.q||null,tag:RSTATE.tag||null,board:RSTATE.board||null,lim:P,off:RSTATE.page*P});
  if(error){$('rlist').innerHTML=`<div class="card">${esc(error.message)}</div>`;return}
  const total=data?.[0]?.total||0,rows=data||[];const pages=Math.max(1,Math.ceil(total/P));
  const pager=`<div class="pager"><label class="small" style="margin-right:auto"><input type="checkbox" style="width:auto" onchange="selAllRecs(${id},this.checked)" ${RSTATE.all?'checked':''}> Select all ${total.toLocaleString()}</label><span class="small">${total?RSTATE.page*P+1:0} - ${Math.min(total,RSTATE.page*P+P)} of ${total.toLocaleString()} results</span><button class="btn ghost sm" ${RSTATE.page?'':'disabled'} onclick="RSTATE.page--;loadRecs(${id})">‹</button><button class="btn ghost sm" ${RSTATE.page<pages-1?'':'disabled'} onclick="RSTATE.page++;loadRecs(${id})">›</button></div>`;
  $('rlist').innerHTML=pager+rows.map(r=>`<div class="card rec"><input type="checkbox" style="width:auto" ${RSTATE.all||RSTATE.sel.has(r.rec_id)?'checked':''} onchange="selRec(${r.rec_id},this.checked)">
     <div class="rl"><a href="#" onclick="openLead(${r.lead_id});return false"><b>${esc(r.owner||'Unknown owner')}</b></a><address class="small">${esc(r.mail_address||'')}<br>${esc([r.mail_city,[r.mail_state,r.mail_zip].filter(Boolean).join(' ')].filter(Boolean).join(', '))}</address>
       <a href="#" class="code" onclick="go('record:${r.rec_id}');return false"><b>Code:</b> ${esc(r.offer_code||'—')}</a>${r.offer_price?` <span class="small muted">Offer ${money(r.offer_price)}</span>`:''}</div>
     <div class="rr card">${r.property_id?`<a href="#" onclick="openProperty(${r.property_id});return false"><b>⛰ ${esc(r.apn||'APN not entered')}</b></a>`:''}<div class="small">${r.address?'⌂ '+esc([r.address,r.city].filter(Boolean).join(', ')):''}</div><div class="small muted">${esc([r.county,r.county_state].filter(Boolean).join(', '))}${r.acres?' | '+(+r.acres).toFixed(2)+' acres':''}</div>
       ${(r.tags||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join(' ')} ${r.deal_board?`<span class="pill hot">${r.deal_board==='seller'?'Seller Deals':'Buyer Deals'}</span>`:''}</div></div>`).join('')+(rows.length?pager:'<div class="card muted">No records match.</div>')}
function selRec(id,on){RSTATE.all=false;on?RSTATE.sel.add(id):RSTATE.sel.delete(id)}
function selAllRecs(cid,on){RSTATE.all=on;RSTATE.sel.clear();loadRecs(cid)}
async function exportCampaign(id){toast('Building export…');const all=[];for(let off=0;;off+=1000){const {data,error}=await sb.rpc('campaign_records_page',{cid:id,q:RSTATE.q||null,tag:RSTATE.tag||null,board:RSTATE.board||null,lim:1000,off});if(error)return toast(error.message);all.push(...data);if(data.length<1000)break}
  const rows=all.filter(r=>RSTATE.all||!RSTATE.sel.size||RSTATE.sel.has(r.rec_id)).map(r=>({Owner:r.owner,'Mail Address':r.mail_address,'Mail City':r.mail_city,'Mail State':r.mail_state,'Mail Zip':r.mail_zip,'Offer Code':r.offer_code,'Offer Price':r.offer_price,APN:r.apn,'Property Address':r.address,'Property City':r.city,County:r.county,State:r.county_state,Acres:r.acres,Tags:(r.tags||[]).join('; ')}));
  const {data:c}=await sb.from('campaigns').select('name').eq('id',id).single();dlCSV(`Campaign Export - ${c.name.replace(/[^\w ]+/g,'')} - ${rows.length} Records.csv`,rows)}
async function adjustPrice(id){const ids=RSTATE.all?null:[...RSTATE.sel];if(!RSTATE.all&&!ids.length)return toast('Select records first (or Select all)');
  openDrawer(head('Adjust Price')+`<div class="card"><p class="small muted" style="margin-top:0">${RSTATE.all?'All records in this campaign':ids.length+' selected records'}</p>
   <label class="f">How</label><select id="ap_m"><option value="set">Set offer price to</option><option value="pct">Change by percent</option><option value="amt">Change by dollars</option></select>
   <label class="f">Amount</label><input id="ap_v" type="number" placeholder="e.g. 15000 or -10"><br><br><button class="btn" onclick="doAdjust(${id})">Apply</button></div>`)}
async function doAdjust(id){const v=+$('ap_v').value;if(!$('ap_v').value)return;const {error}=await sb.rpc('campaign_adjust_price',{cid:id,ids:RSTATE.all?null:[...RSTATE.sel],mode:$('ap_m').value,val:v});
  if(error)return toast(error.message);toast('Prices updated');closeDrawer();loadRecs(id)}
async function remarket(id){const n=prompt('Name for the new campaign (same records, new offer codes)');if(!n)return;const {data,error}=await sb.rpc('campaign_remarket',{cid:id,new_name:n});if(error)return toast(error.message);toast('Remarket campaign created');go('campaign:'+data)}
async function splitCampaign(id){const k=+prompt('Split into how many campaigns?','2');if(!(k>1))return;const {error}=await sb.rpc('campaign_split',{cid:id,parts:k});if(error)return toast(error.message);toast('Split into '+k);go('campaigns')}

// ---------- Mailing Insights (By Month / By County / By Template) ----------
let IST={by:'month'};
async function vInsights(){const [a,b,k]=dashRange();
  $('actions').innerHTML=`<button class="btn ghost" onclick="go('campaigns')">← Back</button>`;
  const [{data:c},dc]=await Promise.all([sb.from('campaigns').select('*').gte('drop_date',a).lte('drop_date',b).limit(2000),campDealCounts()]);
  const key=x=>IST.by==='month'?(x.drop_date||'').slice(0,7):IST.by==='county'?(x.county?`${x.county}, ${x.state||''}`:x.name.replace(/\b(lots?|county|nc|sc|ga|fl|tn|20\d\d|\(.*\)|[*_]+)\b/gi,'').trim()||'Unknown'):(x.template||'No template recorded');
  const G={};(c||[]).forEach(x=>{const s=campStats(x,dc);const g=G[key(x)]||(G[key(x)]={mail:0,cost:0,deals:0,offers:0,purch:0,sales:0});g.mail+=x.records||0;g.cost+=+x.cost||0;g.deals+=s.deals;g.offers+=s.offers;g.purch+=s.purchases;g.sales+=s.sales});
  const rows=Object.entries(G).sort((x,y)=>IST.by==='month'?y[0].localeCompare(x[0]):y[1].deals-x[1].deals);
  const tabs=[['month','By Month'],['template','By Template'],['county','By County']];
  $('view').innerHTML=`<div class="card"><h3 class="sec" style="margin-top:0">Mailing Insights</h3><div class="tabs">${tabs.map(([v,l])=>`<button class="${IST.by===v?'on':''}" onclick="IST.by='${v}';vInsights()">${l}</button>`).join('')}</div>
   <div class="small muted" style="margin-top:6px">Date: ${fmtDate(a)} – ${fmtDate(b)} (change it on the Dashboard)</div></div>
   <div class="card" style="overflow-x:auto;padding:0"><table><tr><th>${IST.by==='month'?'Month':IST.by==='county'?'County':'Template'}</th><th class="right">Mailings Sent</th><th class="right">Mailing Cost</th><th class="right">Responses</th><th class="right">Response Rate</th><th class="right">Deals</th><th class="right">Offers</th><th class="right">Purchases</th><th class="right">Sales</th><th class="right">Cost per Deal</th></tr>
   ${rows.map(([g,v])=>`<tr><td><b>${esc(IST.by==='month'?new Date(g+'-15').toLocaleDateString('en-US',{month:'long',year:'numeric'}):g)}</b></td><td class="right num">${v.mail.toLocaleString()}</td><td class="right num">${money(v.cost)}</td><td class="right num">${v.deals}</td><td class="right num">${v.mail?(v.deals/v.mail*100).toFixed(2):'0.00'}%</td><td class="right num">${v.deals}</td><td class="right num">${v.offers}</td><td class="right num">${v.purch}</td><td class="right num">${v.sales}</td><td class="right num">${v.deals?money(v.cost/v.deals):'—'}</td></tr>`).join('')||'<tr><td colspan="10" class="muted">No insights to show</td></tr>'}</table></div>`}

async function startMailing(id){
  const [{data:c},{data:tpls}]=await Promise.all([sb.from('campaigns').select('*').eq('id',id).single(),sb.from('templates').select('*').eq('kind','mail').order('name')]);
  openDrawer(head('Start Mailing')+`
   <div class="card"><p style="margin-top:0"><b>${esc(c.name)}</b></p>
   <label class="f">Letter template</label><select id="m_tpl">${(tpls||[]).map(t=>`<option value="${esc(t.file_name)}" ${c.template===t.file_name?'selected':''}>${esc(t.name)}</option>`).join('')}</select>
   <label class="f"><input type="checkbox" id="m_sup" checked style="width:auto"> Remove opt-outs, "not selling" and do-not-mail</label>
   <p class="small muted">Downloads the mail-house list with your letter's merge fields (Owner, Greeting, Mail1–3, PropertyAddress, PropertyCity, APN, OfferCode), then opens an email to Brandon, cc Paul, at Impact Mailing with this campaign's status link. Attach the list and the letter from your DM LETTERS folder, then send.</p>
   <button class="btn" onclick="buildMailList(${id})">Download list + draft email</button><div id="m_msg" class="small" style="margin-top:8px"></div></div>`)}
async function buildMailList(id){
  $('m_msg').textContent='Building list…';const all=[];
  for(let from=0;;from+=1000){const {data,error}=await sb.from('campaign_records').select('offer_code, leads(full_name,first_name,last_name,mail_address,mail_city,mail_state,mail_zip,do_not_mail,phone,status), properties(apn,address,city)').eq('campaign_id',id).range(from,from+999);
    if(error){$('m_msg').textContent=error.message;return}all.push(...data);if(data.length<1000)break}
  const sup=new Set(),on=$('m_sup').checked;if(on){const {data:s}=await sb.from('suppression').select('phone,apn');(s||[]).forEach(x=>{if(x.phone)sup.add(x.phone);if(x.apn)sup.add('A'+x.apn)})}
  const rows=all.filter(r=>!on||(!r.leads?.do_not_mail&&r.leads?.status!=='not_selling'&&!sup.has(r.leads?.phone)&&!sup.has('A'+r.properties?.apn)))
   .map(r=>{const l=r.leads||{},p=r.properties||{};return {Owner:l.full_name||[l.first_name,l.last_name].filter(Boolean).join(' '),Greeting:l.first_name||l.full_name||'Property Owner',
     Mail1:l.mail_address||'',Mail2:'',Mail3:[l.mail_city,[l.mail_state,l.mail_zip].filter(Boolean).join(' ')].filter(Boolean).join(', '),PropertyAddress:p.address||'',PropertyCity:p.city||'',APN:p.apn||'',OfferCode:r.offer_code||''}});
  const missing=rows.filter(r=>!r.OfferCode).length;
  const {data:c}=await sb.from('campaigns').select('name,mail_token').eq('id',id).single();
  dlCSV(`${c.name.replace(/[^\w ]+/g,'')} - mail house.csv`,rows);
  await sb.from('campaigns').update({template:$('m_tpl').value,mail_status:'to_house',mail_to_house_at:new Date().toISOString(),records:rows.length}).eq('id',id);
  $('m_msg').innerHTML=`${rows.length.toLocaleString()} records (${all.length-rows.length} removed).${missing?` <b style="color:var(--red)">${missing} have no offer code.</b> Add codes before sending; Brandon flags lists without them.`:''}`;
  const body=`Hello,\n\nAttached is a new list for "${c.name}" (${rows.length} records) and the letter template (${$('m_tpl').value}).\n\nPlease use this link to mark the job Received, Processing and Sent as it moves along:\n${mailLink(c)}\n\nPlease send a sample and postage when ready.\n\nThanks!\nDamien Dupee\nDominion Land Group`;
  window.open(`https://mail.google.com/mail/?view=cm&fs=1&to=${MAIL_HOUSE.to}&cc=${MAIL_HOUSE.cc}&su=${encodeURIComponent('NEW DATA - '+c.name)}&body=${encodeURIComponent(body)}`,'_blank');
}

  const f=(k,l,t='text')=>`<label class="f">${l}</label><input id="c_${k}" type="${t}" value="${esc(c[k]??'')}">`;
  openDrawer(head((id?'Edit':'New')+' campaign')+`<div class="card">${f('name','Name')}
   <label class="f">Type</label><select id="c_channel">${[['mail','Direct mail'],['text','Text'],['call','Cold call'],['other','Other']].map(([v,l])=>`<option value="${v}" ${v===c.channel?'selected':''}>${l}</option>`).join('')}</select>
   <div class="row"><div>${f('county','County')}</div><div>${f('state','State')}</div></div><div class="row"><div>${f('drop_date','Created','date')}</div><div>${f('records','Records','number')}</div><div>${f('cost','Amount spent','number')}</div></div>
   ${f('phone_number','Tracking phone')}<br><br><button class="btn" onclick="saveCampaign(${id||0})">Save</button></div>`)}
async function saveCampaign(id){const v=k=>$('c_'+k).value||null;const r={name:v('name')||'Untitled',channel:$('c_channel').value,county:v('county'),state:v('state'),drop_date:v('drop_date')||new Date().toISOString().slice(0,10),records:+v('records')||0,cost:+v('cost')||0,phone_number:v('phone_number')};

// ---------- global search (like Pebble's top search) ----------
const hl=(t,q)=>{t=esc(t||'');if(!q)return t;const i=t.toLowerCase().indexOf(q.toLowerCase());return i<0?t:t.slice(0,i)+'<mark>'+t.slice(i,i+q.length)+'</mark>'+t.slice(i+q.length)};
async function gsearch(q,lim){const {data,error}=await sb.rpc('global_search',{q,lim});if(error){toast(error.message);return null}return data}
function gsHTML(r,q,full){if(!r)return '';const sec=(title,items,fn,key)=>items&&items.length?`<div class="gh"><span>${title}</span><span>${full?'':items.length}</span></div>`+items.map(fn).join(''):'';
  return sec('Campaign Records',r.records,x=>`<a href="#" onclick="gsGo('record:${x.id}');return false"><b>${hl(x.offer_code,q)}</b> - <b>${esc(x.campaign)}</b><div class="sm">👤 ${esc(x.owner||'')}</div></a>`)
   +sec('Contacts',r.contacts,x=>`<a href="#" onclick="gsGo(null,()=>openLead(${x.id}));return false">${hl(x.name,q)}<div class="sm">${hl(x.phone||'',q)} ${esc([x.mail_address,x.mail_city,x.mail_state].filter(Boolean).join(', '))}</div></a>`)
   +sec('Properties',r.properties,x=>`<a href="#" onclick="gsGo(null,()=>openProperty(${x.id}));return false"><b>⛰ ${hl(x.apn||'',q)}</b><div class="sm">${hl([x.address,x.city].filter(Boolean).join(', '),q)} · ${esc([x.county,x.county_state].filter(Boolean).join(', '))}${x.acres?' | '+(+x.acres).toFixed(2)+' acres':''}</div></a>`)
   +sec('Deals',r.deals,x=>`<a href="#" onclick="gsGo(null,()=>openDeal(${x.id}));return false">${hl(x.title,q)}<div class="sm">${x.board==='buyer'?'Buyer Deals':'Seller Deals'} · ${esc(x.stage||'')}</div></a>`)
   ||'<div class="muted small" style="padding:12px">No results.</div>'}
function gsGo(view,fn){$('gres').style.display='none';if(view)go(view);if(fn)fn()}
(function(){let t;const inp=()=>$('gq');document.addEventListener('input',e=>{if(e.target.id!=='gq')return;clearTimeout(t);const q=e.target.value.trim();if(q.length<2){$('gres').style.display='none';return}
  t=setTimeout(async()=>{const r=await gsearch(q,5);if(inp().value.trim()!==q)return;$('gres').innerHTML=gsHTML(r,q)+`<a href="#" onclick="gsGo('search:${encodeURIComponent(q)}');return false" class="sm" style="text-align:center">See all results</a>`;$('gres').style.display='block'},250)});

let GSTAB='all';
async function vSearch(q){$('title').textContent='Global Search';$('gq').value=q;const r=await gsearch(q,50);if(!r)return;
  const n={records:r.records?.length||0,contacts:r.contacts?.length||0,properties:r.properties?.length||0,deals:r.deals?.length||0};
  const tabs=[['all','All'],['contacts',`Contacts (${n.contacts})`],['properties',`Properties (${n.properties})`],['deals',`Deals (${n.deals})`],['records',`Campaign records (${n.records})`]];
  const pick=GSTAB==='all'?r:{[GSTAB]:r[GSTAB]};
  $('view').innerHTML=`<div class="card"><div class="tabs">${tabs.map(([k,l])=>`<button class="${GSTAB===k?'on':''}" onclick="GSTAB='${k}';vSearch(decodeURIComponent('${encodeURIComponent(q)}'))">${l}</button>`).join('')}</div></div><div class="card gres" style="display:block;position:static;box-shadow:none;max-height:none">${gsHTML(pick,q,true)}</div>`}

async function saveDealFromRecord(id){const {data:r}=await sb.from('campaign_records').select('lead_id,property_id,campaign_id,offer_code').eq('id',id).single();
  const b=$('ad_b').value;const row={board:b,stage_id:+$('ad_s').value,priority:$('ad_p').value||null,value:+$('ad_v').value||null,property_label:$('ad_t').value||null,campaign_id:r.campaign_id,lead_id:r.lead_id,property_id:r.property_id,source:'campaign',status:'open'};

async function vProperties(){
  $('actions').innerHTML=`<button class="btn" onclick="editProperty()">+ Add Property</button>`;
  $('view').innerHTML=`<div class="filters"><input id="pf_county" placeholder="County"><input id="pf_apn" placeholder="APN"><input id="pf_addr" placeholder="Address"><input id="pf_tag" placeholder="Tag"><button class="btn ghost" style="flex:0" onclick="loadProps()">Search</button><button class="btn ghost" style="flex:0" onclick="['pf_county','pf_apn','pf_addr','pf_tag'].forEach(i=>$(i).value='');loadProps(true)">Clear</button></div>
   <div class="split"><div class="plist" id="plist"></div><div id="map"></div></div>`;
  ['pf_county','pf_apn','pf_addr','pf_tag'].forEach(i=>$(i).onkeydown=e=>{if(e.key==='Enter')loadProps()});
  if(map){map.remove();map=null}
  map=L.map('map').setView([35.2,-80.8],9);
  const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Esri'});
  L.control.layers({'Map':street,'Satellite':sat}).addTo(map);mapLayer=L.layerGroup().addTo(map);
  map.on('moveend',()=>{if(!['pf_county','pf_apn','pf_addr','pf_tag'].some(i=>$(i).value))loadProps(true)});
  loadProps(true);
}
async function loadProps(byMap){
  let q=sb.from('properties').select('id,apn,address,city,county,county_state,acres,lat,lng').limit(1000);
  const c=$('pf_county').value.trim(),a=$('pf_apn').value.trim(),ad=$('pf_addr').value.trim(),t=$('pf_tag').value.trim();
  if(c)q=q.ilike('county',c+'%');if(a)q=q.ilike('apn','%'+a+'%');if(ad)q=q.ilike('address','%'+ad+'%');if(t)q=q.contains('tags',[t]);
  if(byMap&&!c&&!a&&!ad&&!t){const b=map.getBounds();q=q.gte('lat',b.getSouth()).lte('lat',b.getNorth()).gte('lng',b.getWest()).lte('lng',b.getEast())}
  const {data,error}=await q;if(error){$('plist').innerHTML=`<div style="padding:12px">${esc(error.message)}</div>`;return}
  const P=data||[];mapLayer.clearLayers();const pts=[];
  P.forEach(p=>{if(p.lat&&p.lng){const m=L.circleMarker([p.lat,p.lng],{radius:6,color:'#5C2977',weight:1,fillColor:'#D5A940',fillOpacity:.85}).bindTooltip(`${esc(p.apn||'')} ${esc(p.address||'')}`);m.on('click',()=>openProperty(p.id));m.addTo(mapLayer);pts.push([p.lat,p.lng])}});
  if(!byMap&&pts.length)map.fitBounds(pts,{maxZoom:15,padding:[20,20]});
  $('plist').innerHTML=`<div class="small muted" style="padding:8px 12px">${P.length===1000?'1,000+':P.length.toLocaleString()} properties${byMap?' in this map area':''}</div>`+P.map(p=>`<div class="pitem" onclick="openProperty(${p.id})"><b>${esc(p.apn||'No APN')}</b><div class="small">${esc([p.address,p.city].filter(Boolean).join(', '))}</div><div class="small muted">${esc(p.county||'')}, ${esc(p.county_state||'')}${p.acres?' | '+(+p.acres).toFixed(2)+' ac':''}</div></div>`).join('');
}

async function openProperty(id){

    sb.from('property_owners').select('leads(*)').eq('property_id',id),

   <div class="card" style="overflow-x:auto"><b>History</b><table style="margin-top:6px">${(cr||[]).map(r=>`<tr><td>${r.sent_at||r.campaigns?.drop_date||''}</td><td>Campaign</td><td>${esc(r.campaigns?.name||'')}</td><td><b>${esc(r.offer_code||'')}</b></td><td class="right">${money(r.offer_price)}</td></tr>`).join('')}
    ${(tx||[]).map(t=>`<tr><td>${t.tx_date||''}</td><td style="text-transform:capitalize">${t.kind}</td><td colspan="2">${esc(t.notes||'')}</td><td class="right"><b>${money(t.price)}</b></td></tr>`).join('')}</table>
    ${buy&&sell?`<p><b>Profit ${money(sell.price-cost)}</b> · ROI ${((sell.price-cost)/cost*100).toFixed(2)}%</p>`:''}
    <div class="row" style="margin-top:10px"><select id="tx_k" style="flex:0 0 120px"><option>offer</option><option>purchase</option><option>sale</option></select><input id="tx_d" type="date"><input id="tx_p" type="number" placeholder="Price"><input id="tx_c" type="number" placeholder="Costs"><button class="btn ghost" style="flex:0" onclick="addTx(${id})">Add</button></div></div>
   <div class="card"><b>Deals</b> ${(dl||[]).map(d=>`<a href="#" onclick="openDeal(${d.id});return false">${d.board} deal · ${esc(STAGES.find(s=>s.id===d.stage_id)?.name||'')}</a>`).join(' · ')||'<span class="muted small">none</span>'}
     <div class="row" style="margin-top:8px"><button class="btn ghost sm" style="flex:0" onclick="dealFromProperty(${id},'seller')">+ Seller deal</button><button class="btn ghost sm" style="flex:0" onclick="dealFromProperty(${id},'buyer')">+ Buyer deal</button></div></div>

// ---- move Pebble call recordings (Desktop / DLG Recordings) into storage ----
function recToolCard(){return `<div class="card"><h3 style="margin-top:0">Move call recordings off Pebble</h3><p class="muted small">Pick the <b>DLG Recordings</b> folder on your Desktop. Each recording is uploaded to DLG HQ and the inbox switches to playing it from here, so nothing is lost when Pebble is cancelled. Safe to run again; it skips files already moved.</p>
  <input type="file" id="recDir" webkitdirectory multiple><br><br><button class="btn" onclick="moveRecordings()">Upload recordings</button><div id="recMsg" class="small" style="margin-top:10px"></div></div>`}
async function moveRecordings(){const fs=[...$('recDir').files];const msg=t=>$('recMsg').innerHTML=t;if(!fs.length)return toast('Pick the DLG Recordings folder');
  const idx=fs.find(f=>/(^|\/)index\.tsv$/.test(f.webkitRelativePath));if(!idx)return msg('index.tsv is missing from that folder.');
  const byPath=Object.fromEntries(fs.map(f=>[f.webkitRelativePath,f]));
  const rows=(await idx.text()).trim().split('\n').map(l=>l.split('\t')).filter(r=>r.length>=4);
  const left=[];for(let o=0;;o+=1000){const {data}=await sb.from('messages').select('recording_url').like('recording_url','%/uploads/phone_recordings/%').range(o,o+999);left.push(...(data||[]));if(!data||data.length<1000)break}
  const need=new Set((left||[]).map(m=>m.recording_url.replace(/^.*\/uploads\/phone_recordings\//,'')));
  const todo=rows.filter(r=>need.has(r[2])&&byPath[r[3]]);let ok=0,bad=0,pend=[];
  msg(`Uploading ${todo.length.toLocaleString()} recordings…`);
  const flush=async()=>{if(!pend.length)return;const p=pend;pend=[];await sb.rpc('set_recording_paths',{rows:p})};
  let i=0;const worker=async()=>{while(i<todo.length){const r=todo[i++];const path=`${r[0]}/${r[1]}.mp3`;
    const {error}=await sb.storage.from('call-recordings').upload(path,byPath[r[3]],{upsert:true,contentType:'audio/mpeg'});
    if(error){bad++}else{ok++;pend.push({pebble:r[2],path});if(pend.length>=50)await flush()}
    if((ok+bad)%10===0)msg(`Uploaded ${ok.toLocaleString()} of ${todo.length.toLocaleString()}${bad?` · ${bad} failed`:''}… keep this tab open.`)}};
  await Promise.all([worker(),worker(),worker(),worker()]);await flush();
  msg(`<b>Done.</b> ${ok.toLocaleString()} recordings moved${bad?`, ${bad} failed (run again to retry)`:''}.`)}
async function nextPrefix(){const {data}=await sb.rpc('next_code_prefix');return data??'—'}
const IMP_FIELDS={full_name:['ownername','owner','name','fullname','owner1fullname','owner1name'],first_name:['firstname','owner1firstname'],last_name:['lastname','owner1lastname'],
  phone:['phone','phoneprimary','phone1','mobile'],email:['email'],
  mail_address:['mailingaddress','mailaddress','mailingstreetaddress','addressline1'],mail_city:['mailingcity','mailcity'],mail_state:['mailingstate','mailstate'],mail_zip:['mailingzip','mailzip','mailingzipcode'],
  apn:['apn','parcel','parcelid','parcelnumber','propertyassessorsparcelnumberapn'],address:['propertyaddress','situsaddress','siteaddress','address'],city:['propertycity','situscity','city'],state:['propertystate','situsstate','state'],zip:['propertyzip','situszip','zip'],
  county:['county','countyname','propertycounty'],acres:['acres','lotacres','acreage','lotsizeacres'],lat:['latitude','lat'],lng:['longitude','lng','long'],offer_price:['offerprice','offer','offeramount'],offer_code:['offercode','code','referencecode']};
const impKey=k=>k.toLowerCase().replace(/[^a-z0-9]/g,'');
function impMapCols(cols){const m={};for(const [f,ks] of Object.entries(IMP_FIELDS)){const c=cols.find(x=>ks.includes(impKey(x)));if(c)m[f]=c}return m}
function previewImport(){const f=$('impFile').files[0];if(!f)return;Papa.parse(f,{header:true,preview:3,complete:r=>{const m=impMapCols(r.meta.fields||[]);
  $('impMap').innerHTML='<b>Columns matched:</b> '+Object.entries(m).map(([k,v])=>`${k.replace('_',' ')} ← <i>${esc(v)}</i>`).join(' · ')+(m.offer_code?'':' <br><span class="muted">No offer code column — codes will be assigned automatically.</span>')}})}
async function runImport(){const f=$('impFile').files[0];if(!f)return toast('Choose a CSV');const msg=t=>$('impMsg').innerHTML=t;
  let cid=$('impCamp').value;
  if(cid==='new'){if(!$('icName').value)return toast('Name the campaign');const {data,error}=await sb.from('campaigns').insert({name:$('icName').value,channel:'mail',county:$('icCounty').value||null,state:$('icState').value||null,drop_date:$('icDate').value||null,cost:Number($('icCost').value)||0,source:'hq',mail_status:'not_sent'}).select('id').single();if(error)return toast(error.message);cid=data.id}
  Papa.parse(f,{header:true,skipEmptyLines:true,complete:async r=>{const m=impMapCols(r.meta.fields||[]);
    const rows=r.data.map(o=>{const x={};for(const [k,c] of Object.entries(m)){let v=o[c]==null?'':String(o[c]).trim();if(!v)continue;if(['acres','lat','lng','offer_price'].includes(k)){v=Number(v.replace(/[$,]/g,''));if(isNaN(v))continue}x[k]=v}
      if(!x.full_name&&(x.first_name||x.last_name))x.full_name=[x.first_name,x.last_name].filter(Boolean).join(' ');return x}).filter(x=>x.full_name||x.phone||x.apn||x.address);
    if(cid==='none'){let done=0;for(let i=0;i<rows.length;i+=500){const part=rows.slice(i,i+500).map(x=>({source:$('impSource').value,status:'record',full_name:x.full_name,first_name:x.first_name,last_name:x.last_name,phone:x.phone,email:x.email,mail_address:x.mail_address,mail_city:x.mail_city,mail_state:x.mail_state,mail_zip:x.mail_zip,apn:x.apn,county:x.county,offer_code:x.offer_code,tags:$('impTag').value?[$('impTag').value]:[]}));
      const {error}=await sb.from('leads').insert(part);if(error)return msg(error.message);done+=part.length;msg(`Imported ${done.toLocaleString()} of ${rows.length.toLocaleString()} contacts`)}return}
    const tot={leads:0,properties:0,records:0};
    for(let i=0;i<rows.length;i+=1000){const {data,error}=await sb.rpc('import_campaign_list',{cid:Number(cid),rows:rows.slice(i,i+1000),src:$('impSource').value,tag:$('impTag').value||null});
      if(error)return msg('Stopped: '+esc(error.message));for(const k in tot)tot[k]+=data[k];msg(`Imported ${tot.records.toLocaleString()} of ${rows.length.toLocaleString()} records…`)}
    const {data:fin,error:e2}=await sb.rpc('finish_campaign_import',{cid:Number(cid)});if(e2)return msg(esc(e2.message));
    msg(`<b>Done.</b> ${tot.records.toLocaleString()} records · ${tot.leads.toLocaleString()} new contacts · ${tot.properties.toLocaleString()} new properties · ${fin.coded.toLocaleString()} offer codes assigned (starting ${esc(fin.first_code||'')}). <a href="#" onclick="go('campaign:${cid}');return false">Open campaign →</a>`)}})}

boot();
</script>
</body>
